name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npm run verify:build
      - uses: actions/upload-artifact@v7
        with:
          name: review-bridge-v0.1.0
          path: dist/review-bridge-v0.1.0
